<head>

  <title>Phan Sci-Fi Lineage · Phả Hệ Tương Lai</title>

  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050a15;
      color: #e0faff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated starfield background */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(1px 1px at 20% 30%, #ffffff33, transparent),
        radial-gradient(1px 1px at 40% 70%, #ffffff22, transparent),
        radial-gradient(1px 1px at 60% 20%, #ffffff11, transparent),
        radial-gradient(1px 1px at 80% 50%, #ffffff22, transparent),
        radial-gradient(1.5px 1.5px at 10% 80%, #00f0ff33, transparent),
        radial-gradient(1.5px 1.5px at 90% 10%, #ff69b422, transparent);
      background-size: 200px 200px, 150px 150px, 250px 250px, 180px 180px, 300px 300px, 280px 280px;
      animation: drift 60s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes drift {
      0% { transform: translateY(0); }
      100% { transform: translateY(-200px); }
    }

    /* Header */
    .header {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 40px 20px 20px;
      border-bottom: 1px solid #00f0ff22;
    }

    .header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.4rem, 4vw, 2.4rem);
      font-weight: 900;
      letter-spacing: 6px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00f0ff, #007acc, #ff69b4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      margin-bottom: 8px;
    }

    .header p {
      font-size: clamp(0.75rem, 2vw, 0.95rem);
      color: #007acc;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-family: 'Orbitron', sans-serif;
      font-weight: 400;
    }

    /* SVG Container */
    .lineage-container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 20px auto 0;
      padding: 0 10px;
    }

    .lineage-container svg {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 20px #00f0ff11);
    }

    /* Footer */
    .footer {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 30px 20px 50px;
      border-top: 1px solid #00f0ff11;
    }

    .footer a {
      color: #007acc;
      text-decoration: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 3px;
      transition: color 0.3s;
    }

    .footer a:hover { color: #00f0ff; }

    .footer .copy {
      margin-top: 10px;
      font-size: 0.7rem;
      color: #334466;
      letter-spacing: 2px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .header { padding: 25px 15px 15px; }
      .lineage-container { padding: 0 5px; }
    }
  </style>
</head>
